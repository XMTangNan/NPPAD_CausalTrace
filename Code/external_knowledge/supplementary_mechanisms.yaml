    review_note: "AI 代审（2026-11-14 复核）：FLB 的 15 变量集不含 P（一回路压力不属于 FLB 选变量），本条无可作用对象，判 rejected 并撤出约束层。条目保留仅为留痕，不得引用。"
  - id: S15_FLB_PRB_response
    kind: response_role
    variable: PRB
    name_cn: 安全壳压力
    unit: bar
    subsystem: 安全壳
    applicable_accidents: [FLB]
    expected_direction: pos
    role_in_accident: response
    can_be_root: false
    asserted_edges: []
