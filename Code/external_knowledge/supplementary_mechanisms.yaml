    unsourced_reason: "条目变量 P 不在 FLB 模型内（FLB 15 变量含 PRB/PSGA 但不含 P），已判 rejected；撤出约束层。"
    basis: "二次侧失冷使一回路温度/压力变化，低压信号触发安注；P 是传导节点。"
