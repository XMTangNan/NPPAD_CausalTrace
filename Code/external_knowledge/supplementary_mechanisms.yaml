      basis: "喷淋是压力/水位偏差下的控制动作，不驱动破口流量或二次侧状态。"
      sourced: true
      source_ref: E5
    sourced: true
    source_ref: [E5]
    basis: "稳压器喷淋由压力偏差触发，属控制动作。"
    conflicts_with: []
    source: "外部知识补强（2026-11-14）"
    date: "2026-11-14"
    reviewed_by: ai_agent
    expert_confirmed: false
    review_verdict: accepted
    review_note: "AI 代审：控制动作出边只禁到过程量与 marker；喷淋→压力不在禁用列表（降压作用真实）。"
